<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>P2P Screen Sharing (Rust + WebRTC)</title>
    <script type="module">import init from './client-ui.js'; init('./client-ui_bg.wasm');</script>
    <style>
        :root {
            color-scheme: dark;
            --bg-primary: #0f172a;
            --bg-panel: #1e293b;
            --bg-card: #334155;
            --text-primary: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #38bdf8;
            --accent-hover: #0284c7;
            --danger: #ef4444;
            --success: #22c55e;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: var(--bg-primary);
            color: var(--text-primary);
            font-family: system-ui, -apple-system, sans-serif;
            min-height: 100vh;
        }
        .app-shell {
            max-width: 1280px;
            margin: 0 auto;
            padding: 1.5rem;
        }
        .panel {
            background: var(--bg-panel);
            border-radius: 0.75rem;
            padding: 1.5rem;
            margin-bottom: 1.25rem;
            border: 1px solid #334155;
        }
        .row {
            display: flex;
            gap: 0.75rem;
            align-items: center;
            flex-wrap: wrap;
            margin-top: 0.75rem;
        }
        input, select {
            appearance: none;
            -webkit-appearance: none;
            background-color: #0f172a;
            color: #f8fafc;
            border: 1px solid #475569;
            border-radius: 0.5rem;
            padding: 0.6rem 0.85rem;
            font-size: 0.95rem;
        }
        input:focus, select:focus {
            outline: none;
            border-color: var(--accent);
        }
        option {
            background-color: #0f172a;
            color: #f8fafc;
        }
        button {
            background: var(--accent);
            color: #0f172a;
            font-weight: 600;
            border: none;
            border-radius: 0.5rem;
            padding: 0.6rem 1.1rem;
            cursor: pointer;
            transition: background 0.15s ease, border-color 0.15s ease;
        }
        button:hover {
            background: var(--accent-hover);
            color: #fff;
        }
        button.danger {
            background: var(--danger);
            color: #fff;
        }
        button.choice-btn {
            background: #0f172a;
            color: var(--text-primary);
            border: 1px solid #475569;
            font-weight: 500;
            padding: 0.5rem 0.95rem;
        }
        button.choice-btn:hover {
            border-color: var(--accent);
            background: #1e293b;
            color: #fff;
        }
        button.choice-btn.active {
            background: var(--accent);
            color: #0f172a;
            border-color: var(--accent);
            font-weight: 700;
        }
        .source-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 0.65rem;
            max-height: 260px;
            overflow-y: auto;
            margin-top: 0.6rem;
            padding: 0.25rem;
        }
        .source-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.6rem;
            text-align: left;
            background: #0f172a;
            color: var(--text-primary);
            border: 2px solid #334155;
            border-radius: 0.6rem;
            padding: 0.7rem 0.9rem;
            cursor: pointer;
            font-weight: 500;
        }
        .source-item:hover {
            border-color: #64748b;
            background: #1e293b;
            color: var(--text-primary);
        }
        .source-item.active {
            border-color: var(--accent);
            background: rgba(56, 189, 248, 0.14);
            color: #fff;
        }
        .source-badge {
            font-size: 0.7rem;
            font-weight: 700;
            padding: 0.15rem 0.45rem;
            border-radius: 0.3rem;
            background: #334155;
            color: #e2e8f0;
            flex-shrink: 0;
        }
        .source-item.active .source-badge {
            background: var(--accent);
            color: #0f172a;
        }
        .stage-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(380px, 1fr));
            gap: 1rem;
            margin-top: 1rem;
        }
        .peer-card {
            background: #020617;
            border: 1px solid #334155;
            border-radius: 0.75rem;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        .peer-card canvas {
            width: 100%;
            height: auto;
            aspect-ratio: 16 / 9;
            background: #000;
            display: block;
        }
        .peer-header {
            padding: 0.5rem 0.85rem;
            font-size: 0.85rem;
            color: var(--text-muted);
            background: var(--bg-panel);
            display: flex;
            justify-content: space-between;
        }
        .error-banner {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid var(--danger);
            color: #fca5a5;
            padding: 0.75rem 1rem;
            border-radius: 0.5rem;
            margin-bottom: 1rem;
        }
    </style>
</head>
<body></body>
</html>
