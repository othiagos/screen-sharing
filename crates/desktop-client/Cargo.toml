[package]
name = "desktop-client"
version = "0.2.0"
edition = "2021"
build = "build.rs"
description = "Native GPUI Kit desktop client for Screen Share with GPU-accelerated game capture"

[target.'cfg(windows)'.build-dependencies]
embed-resource = "3.0"

[dependencies]
shared-protocol = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
dashmap = { workspace = true }
futures-util = { workspace = true }
parking_lot = { workspace = true }
ringbuf = { workspace = true }

quinn = { workspace = true }
rustls = { workspace = true }
sha2 = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
bytes = { workspace = true }

gpui-kit = { workspace = true }
image = { workspace = true }
smallvec = { workspace = true }
directories = { workspace = true }

xcap = { workspace = true }
fast_image_resize = { workspace = true }
yuv = { workspace = true }
openh264 = { workspace = true }
openh264-sys2 = "0.6"
qoi = { workspace = true }
jpeg-encoder = { workspace = true }
zune-core = { workspace = true }
zune-jpeg = { workspace = true }

cpal = { workspace = true }
audiopus = { workspace = true }

thiserror = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = [
    "implement",
    "Foundation",
    "Graphics_Capture",
    "Graphics_DirectX",
    "Graphics_DirectX_Direct3D11",
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    "Win32_Media_KernelStreaming",
    "Win32_Media_MediaFoundation",
    "Win32_Media_Multimedia",
    "Win32_Security",
    "Win32_Storage_Xps",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_System_WinRT",
    "Win32_System_WinRT_Direct3D11",
    "Win32_System_WinRT_Graphics_Capture",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
] }
windows-core = "0.58"

[target.'cfg(target_os = "linux")'.dependencies]
pipewire = "0.10"
ashpd = { version = "0.14", default-features = false, features = ["screencast", "async-io"] }

[dev-dependencies]
sfu-server = { workspace = true }
rcgen = { workspace = true }
