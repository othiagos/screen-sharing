name: CI & Release Build (Linux & Windows)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  build-linux:
    name: Linux (Test & Build x64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake pkg-config libclang-dev nasm \
            libpipewire-0.3-dev libspa-0.2-dev libasound2-dev \
            libxcb1-dev libxrandr-dev libdbus-1-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libvulkan-dev \
            libfontconfig1-dev libfreetype-dev libgbm-dev libegl-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Cargo registry and target
        uses: Swatinem/rust-cache@v2

      - name: Run Clippy Lints
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run Unit and E2E Tests (Linux)
        run: cargo test --workspace

      - name: Build Linux Release Executables
        run: cargo build --release -p desktop-client -p sfu-server

      - name: Package Linux Release Archives
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG_NAME="${GITHUB_REF_NAME}"
          else
            TAG_NAME="dev"
          fi
          mkdir -p dist/stage-client dist/stage-sfu
          cp target/release/desktop-client LICENSE dist/stage-client/
          cp target/release/sfu-server LICENSE dist/stage-sfu/
          tar -czf "dist/screen-share-client-${TAG_NAME}-linux-x64.tar.gz" -C dist/stage-client desktop-client LICENSE
          tar -czf "dist/screen-share-sfu-${TAG_NAME}-linux-x64.tar.gz" -C dist/stage-sfu sfu-server LICENSE

      - name: Upload Linux Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-linux-x64
          path: dist/screen-share-*.tar.gz

  build-windows:
    name: Windows (Test & Build x64)
    runs-on: windows-latest
    env:
      CMAKE_POLICY_VERSION_MINIMUM: "3.5"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: clippy

      - name: Install NASM (for OpenH264 SIMD acceleration)
        uses: ilammy/setup-nasm@v1

      - name: Cache Cargo registry and target
        uses: Swatinem/rust-cache@v2

      - name: Run Clippy Lints (Windows)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run Unit and E2E Tests (Windows)
        run: cargo test --workspace

      - name: Build Windows Release Executables
        run: cargo build --release -p desktop-client -p sfu-server

      - name: Package Windows Release Archives
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if ($env:GITHUB_REF -like "refs/tags/*") {
            $tagName = $env:GITHUB_REF_NAME
          } else {
            $tagName = "dev"
          }
          New-Item -ItemType Directory -Force -Path dist/stage-client, dist/stage-sfu | Out-Null
          Copy-Item target/release/desktop-client.exe, LICENSE dist/stage-client/
          Copy-Item target/release/sfu-server.exe, LICENSE dist/stage-sfu/
          Compress-Archive -Path dist/stage-client/* -DestinationPath "dist/screen-share-client-$tagName-windows-x64.zip" -Force
          Compress-Archive -Path dist/stage-sfu/* -DestinationPath "dist/screen-share-sfu-$tagName-windows-x64.zip" -Force

      - name: Upload Windows Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-windows-x64
          path: dist/screen-share-*.zip

  release:
    name: Create GitHub Draft Release
    needs: [build-linux, build-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Linux Release Artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-linux-x64
          path: dist

      - name: Download Windows Release Artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-windows-x64
          path: dist

      - name: Generate SHA-256 Checksums
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum screen-share-* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish Draft GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Screen Share ${{ github.ref_name }}"
          draft: true
          generate_release_notes: true
          files: dist/*
