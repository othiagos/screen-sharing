[workspace]
resolver = "2"
members = [
    "crates/shared-protocol",
    "crates/sfu-server",
    "crates/desktop-client",
]
default-members = [
    "crates/shared-protocol",
    "crates/sfu-server",
    "crates/desktop-client",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"

[workspace.dependencies]
shared-protocol = { path = "crates/shared-protocol" }
sfu-server = { path = "crates/sfu-server" }

tokio = { version = "1.40", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
dashmap = "6.1"
futures-util = "0.3"
parking_lot = "0.12"
ringbuf = "0.4"

quinn = "0.11"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rcgen = "0.13"
rustls-pemfile = "2.2"
sha2 = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.10", features = ["v4", "serde"] }
bytes = "1.7"

gpui-kit = "0.9"
image = { version = "0.25", default-features = false, features = ["png"] }
smallvec = "1.13"
directories = "5.0"

xcap = "0.9"
fast_image_resize = "4.2"
yuv = "0.1.6"
openh264 = "0.6"

cpal = "0.15"
audiopus = "0.3.0-rc.0"

thiserror = "2.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.dev.package.fast_image_resize]
opt-level = 3

[profile.dev.package.openh264]
opt-level = 3

[profile.dev.package.openh264-sys2]
opt-level = 3

[profile.dev.package.yuv]
opt-level = 3

[profile.dev.package.xcap]
opt-level = 3

[profile.dev.package.desktop-client]
opt-level = 2

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

